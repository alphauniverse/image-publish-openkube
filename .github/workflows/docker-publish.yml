name: Build and Push Docker Image (Reusable)

# 可复用工作流：所有镜像目录通过 workflow_call 调用本工作流
# 共享仓库级 Secrets: DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
# 调用方需通过 inputs 提供镜像仓库名、构建上下文、Dockerfile 路径等参数
on:
  workflow_call:
    inputs:
      # 目标镜像仓库名（不含用户名前缀），如 mirror-hub；将拼接为 DOCKERHUB_USERNAME/image_repo
      image_repo:
        description: "Image repo name (e.g. mirror-hub). Combined as DOCKERHUB_USERNAME/image_repo"
        required: true
        type: string
      # 构建上下文目录（相对仓库根），如 mirror-hub/
      context:
        description: "Build context directory, e.g. mirror-hub/"
        required: true
        type: string
      # Dockerfile 路径（相对仓库根），如 mirror-hub/Dockerfile
      dockerfile:
        description: "Dockerfile path, e.g. mirror-hub/Dockerfile"
        required: true
        type: string
      # 基础镜像，作为 build-arg BASE_IMAGE 传入；留空则使用 Dockerfile 内默认值
      base_image:
        description: "Base image passed as BASE_IMAGE build-arg (optional)"
        required: false
        type: string
        default: ""
      # 目标平台，默认 amd64 + arm64
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      # 用于 semver tag 提取的 tag 前缀，如 mirror-hub/v1.0.0 -> 前缀 mirror-hub/
      tag_prefix:
        description: "Tag prefix for semver extraction, e.g. mirror-hub/"
        required: false
        type: string
        default: ""
      # 外部源码仓库（可选），如 TencentCloud/Octop。留空则仅用本仓库代码构建
      source_repo:
        description: "External source repo to checkout (e.g. TencentCloud/Octop). Empty = build from this repo only."
        required: false
        type: string
        default: ""
      # 外部源码的 ref（tag/branch/commit）
      source_ref:
        description: "Ref of external source repo (tag/branch/commit)"
        required: false
        type: string
        default: "main"
      # 外部源码 checkout 到的路径（相对仓库根）
      source_path:
        description: "Path to checkout external source into"
        required: false
        type: string
        default: "_external"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout external source (optional)
        if: ${{ inputs.source_repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: ${{ inputs.source_path }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare source ref tag
        if: ${{ inputs.source_repo != '' && inputs.source_ref != 'main' }}
        id: source-tag
        run: |
          REF="${{ inputs.source_ref }}"
          # 去掉前导 v（如 v0.9.19 -> 0.9.19）
          TAG="${REF#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}},prefix=${{ inputs.tag_prefix }}
            type=semver,pattern={{major}}.{{minor}},prefix=${{ inputs.tag_prefix }}
            type=sha,format=short
            # 外部源码模式：将 source_ref 去掉 v 前缀后作为版本 tag（排除 main 等非版本 ref）
            type=raw,value=${{ steps.source-tag.outputs.tag }},enable=${{ inputs.source_repo != '' && inputs.source_ref != 'main' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
