name: octop

# 监听工作流文件变化并调用共享工作流，从外部仓库 TencentCloud/Octop 拉取源码构建
# 与 mirror-hub 不同：Octop 源码在外部仓库，无官方预构建镜像，需从源码多阶段构建
# 新增其他"外部源码镜像"时，复制本文件改名并调整 source_repo / source_ref 即可
on:
  schedule:
    # 每小时检测上游 tag 变动，15 分避开整点资源拥堵
    - cron: "15 * * * *"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/octop.yml"
      - ".github/workflows/docker-publish.yml"
    tags:
      - "octop/v*"
  workflow_dispatch:
    inputs:
      octop_ref:
        description: "Octop 源码 ref (tag/branch/commit)，留空则用 vars.OCTOP_REF 或 main"
        required: false
        default: ""

jobs:
  # schedule 触发时：检测上游最新 tag，查 Docker Hub 是否已存在，决定是否构建
  check-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
    steps:
      - name: Detect upstream latest tag
        id: detect
        run: |
          # 获取上游最新 tag（按版本号降序排序）
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname \
            https://github.com/TencentCloud/Octop.git \
            | head -1 \
            | sed 's|.*refs/tags/||' \
            | sed 's|\^{}||')

          if [ -z "$LATEST_TAG" ]; then
            echo "::warning::No tags found in upstream, skipping build"
            echo "upstream_tag=main" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Upstream latest tag: $LATEST_TAG"
          echo "upstream_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check Docker Hub for existing tag
        id: check
        if: steps.detect.outputs.upstream_tag != 'main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TAG="${{ steps.detect.outputs.upstream_tag }}"
          echo "Checking if tag $TAG exists on Docker Hub..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/octop/tags/$TAG/")

          echo "Docker Hub API response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "404" ]; then
            echo "Tag $TAG not found on Docker Hub, will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "Tag $TAG already exists on Docker Hub, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "::warning::Unexpected Docker Hub API response: $HTTP_CODE, proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # 构建推送
  call-docker-publish:
    needs: check-upstream
    if: |
      always() && (
        (github.event_name == 'schedule' && needs.check-upstream.outputs.should_build == 'true') ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_repo: octop
      context: _external
      dockerfile: _external/docker/Dockerfile
      platforms: linux/amd64,linux/arm64
      tag_prefix: octop/
      source_repo: TencentCloud/Octop
      # schedule: 用检测到的上游 tag；push/dispatch: 保持原逻辑
      source_ref: ${{ github.event_name == 'schedule' && needs.check-upstream.outputs.upstream_tag || github.event.inputs.octop_ref || vars.OCTOP_REF || 'main' }}
      source_path: _external
    secrets: inherit
